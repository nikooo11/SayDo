stt:
  engine: faster-whisper      # faster-whisper | mlx-whisper (optional faster path)
  model: tiny.en              # tiny.en | base | small | medium | large-v3
  language: null              # null = auto-detect, or e.g. "en"
  compute_type: int8          # int8 is fastest on CPU for CTranslate2

llm:
  enabled: true
  # auto = cloud API if api_key is set, else local Ollama if installed, else raw
  # api = cloud only | ollama = local only
  mode: auto
  api:
    # free key: sign up at console.groq.com (no credit card), paste it here, restart
    api_key: ""
    base_url: https://api.groq.com/openai/v1
    model: llama-3.1-8b-instant
  # local fallback: edit llm.model below, then restart
  model: qwen3:4b-instruct
  base_url: http://localhost:11434
  temperature: 0.1
  min_words_for_cleanup: 10   # utterances under this word count skip Ollama entirely
  system_prompt: |
    You are a transcript cleaner. You receive raw speech-to-text output.
    Your ONLY job: remove filler words (um, uh, like, you know), fix
    capitalization, and fix punctuation. Output the cleaned text and NOTHING else.
    NEVER rewrite, rephrase, translate, summarize, answer questions, or add
    content. If the text is already clean, return it unchanged.

hotkey:
  # single key (alt_r, ctrl_r, f13) or a chord like "ctrl+alt".
  # note: macOS does not let apps see the fn key, so fn cannot be used.
  key: ctrl+cmd
  # hold = record while keys are held | toggle = press once to start, again to stop
  mode: hold

audio:
  sample_rate: 16000
  channels: 1
  preroll_ms: 500             # ring buffer so the first word isn't clipped
  device: null                # input device name (see Settings); null = system default

app_modes:
  # per-app dictation modes. A rule matches when "match" is a case-insensitive
  # substring of the frontmost app's name; first match wins, default standard.
  #   standard — corrections + LLM cleanup + snippets
  #   code     — corrections + snippets, no cleanup, trailing period dropped
  #   raw      — corrections only
  # example: rules: [{match: Terminal, mode: code}]
  rules: []

inject:
  method: paste               # paste (clipboard + synthesized Cmd+V) | type (per-char CGEvent)
  restore_clipboard: true

ui:
  flow_bar: true              # persistent dictation pill at the bottom of the screen
  sounds: true                # soft tick when recording starts/stops
  mute_music: false           # pause Music/Spotify while dictating
